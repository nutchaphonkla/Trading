name: AI Background Learning

on:
  workflow_dispatch:

  schedule:
    - cron: "23 * * * *"

  workflow_run:
    workflows:
      - "Update XAUUSD data pack"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: onemonth-ai-learning-v362
  cancel-in-progress: true

jobs:
  learn:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest
    timeout-minutes: 24

    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python ML runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ml.txt

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ml.txt

      - name: Validate all V36.2 AI builders
        run: |
          node --check build-ai-history.mjs
          node --check build-ai-learning.mjs
          node --check build-ai-journal.mjs
          node --check build-ai-governance.mjs
          python -m py_compile ml-train.py

      - name: Verify active market feed
        run: |
          node - <<'NODE'
          const fs = require("fs");

          if (!fs.existsSync("feed-health.json")) {
            console.log(
              "feed-health.json not found - historical brain can still rebuild"
            );

            process.exit(0);
          }

          const h = JSON.parse(
            fs.readFileSync(
              "feed-health.json",
              "utf8"
            )
          );

          console.log(
            "ACTIVE FEED:",
            h.active
          );

          console.log(
            "MODE:",
            h.mode
          );

          console.log(
            "STATUS:",
            h.status
          );

          console.log(
            "REASON:",
            h.reason
          );

          if (
            h.switching?.mergeFeeds === true
          ) {
            throw new Error(
              "Feed policy error: Twelve + MT5 must not be merged"
            );
          }
          NODE

      # ==================================================
      # HISTORICAL BRAIN
      # ==================================================

      - name: Rebuild rolling historical brain
        run: node build-ai-history.mjs

      # ==================================================
      # STATISTICAL CHALLENGER
      # ==================================================

      - name: Train statistical challenger
        run: node build-ai-learning.mjs

      # ==================================================
      # OUTCOME JOURNAL
      # ==================================================

      - name: Resolve old signal and pending outcomes
        run: node build-ai-journal.mjs

      # ==================================================
      # CHAMPION / CHALLENGER
      # ==================================================

      - name: Champion challenger governance
        run: node build-ai-governance.mjs

      # ==================================================
      # PYTHON AUTOML
      # ==================================================

      - name: Train autonomous Python ML tournament
        env:
          ML_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python ml-train.py

      # ==================================================
      # JOURNAL NEW QUALIFIED PLANS
      # ==================================================

      - name: Journal deployed and ML pending plans
        run: node build-ai-journal.mjs

      # ==================================================
      # VERIFY EVERYTHING
      # ==================================================

      - name: Verify V36.2 autonomous brain packs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              "ai-history.json",
              "ai-learning.json",
              "ai-learning-candidate.json",
              "ai-model-governance.json",
              "ai-outcome-journal.json",
              "ai-ml-brain.json",
              "ai-ml-candidate.json",
              "ai-ml-governance.json",
          ]

          for name in required:
              p = Path(name)

              if not p.exists():
                  raise SystemExit(
                      f"missing {name}"
                  )

              json.loads(
                  p.read_text()
              )

          ml = json.loads(
              Path(
                  "ai-ml-brain.json"
              ).read_text()
          )

          if Path(
              "feed-health.json"
          ).exists():

              feed = json.loads(
                  Path(
                      "feed-health.json"
                  ).read_text()
              )

          else:
              feed = {}

          print(
              "FEED",
              {
                  "active":
                      feed.get("active"),

                  "mode":
                      feed.get("mode"),

                  "status":
                      feed.get("status"),

                  "reason":
                      feed.get("reason"),
              },
          )

          print(
              "PYTHON ML",
              {
                  "ready":
                      ml.get("ready"),

                  "status":
                      ml.get("status"),

                  "health":
                      (
                          ml.get(
                              "modelHealth"
                          )
                          or {}
                      ).get("score"),

                  "samples":
                      (
                          ml.get(
                              "training"
                          )
                          or {}
                      ).get(
                          "candidateSamples"
                      ),

                  "filled":
                      (
                          ml.get(
                              "training"
                          )
                          or {}
                      ).get(
                          "filledSamples"
                      ),

                  "primary":
                      (
                          (
                              ml.get(
                                  "current"
                              )
                              or {}
                          ).get(
                              "primary"
                          )
                          or {}
                      ).get("type"),

                  "reference":
                      (
                          (
                              ml.get(
                                  "current"
                              )
                              or {}
                          ).get(
                              "reference"
                          )
                          or {}
                      ).get("type"),

                  "qualified":
                      (
                          ml.get(
                              "current"
                          )
                          or {}
                      ).get(
                          "qualifiedCount"
                      ),

                  "models":
                      (
                          (
                              (
                                  (
                                      ml.get(
                                          "autoML"
                                      )
                                      or {}
                                  ).get(
                                      "heads"
                                  )
                                  or {}
                              ).get(
                                  "tp1"
                              )
                              or {}
                          ).get(
                              "selection"
                          )
                          or {}
                      ).get(
                          "selectedModels"
                      ),

                  "calibration":
                      (
                          (
                              (
                                  (
                                      ml.get(
                                          "autoML"
                                      )
                                      or {}
                                  ).get(
                                      "heads"
                                  )
                                  or {}
                              ).get(
                                  "tp1"
                              )
                              or {}
                          ).get(
                              "calibration"
                          )
                          or {}
                      ).get(
                          "selected"
                      ),

                  "tp1Auc":
                      (
                          (
                              (
                                  ml.get(
                                      "validation"
                                  )
                                  or {}
                              ).get(
                                  "tp1"
                              )
                              or {}
                          ).get(
                              "auc"
                          )
                      ),

                  "tp1Brier":
                      (
                          (
                              (
                                  ml.get(
                                      "validation"
                                  )
                                  or {}
                              ).get(
                                  "tp1"
                              )
                              or {}
                          ).get(
                              "brier"
                          )
                      ),
              },
          )
          PY

      # ==================================================
      # COMMIT AI BRAIN
      # ==================================================

      - name: Commit governed brains and ML packs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for f in \
            ai-history.json \
            ai-learning.json \
            ai-learning-candidate.json \
            ai-learning-previous.json \
            ai-model-governance.json \
            ai-outcome-journal.json \
            ai-ml-brain.json \
            ai-ml-candidate.json \
            ai-ml-governance.json
          do
            if [ -e "$f" ]; then
              git add "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "No AI brain changes"
            exit 0
          fi

          git commit -m "ai: refresh V36.2 primary failover AutoML brain"

          git pull --rebase origin "${GITHUB_REF_NAME}"

          git push origin "HEAD:${GITHUB_REF_NAME}"
