name: AI Background Learning

on:
  workflow_dispatch:

  schedule:
    - cron: "23 * * * *"

  workflow_run:
    workflows:
      - "Update XAUUSD data pack"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: kage-v44-repo-writer
  cancel-in-progress: false

jobs:
  learn:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ml.txt

      - name: Install ML dependencies
        run: |
          python -V
          python -m pip --version

          python -m pip install \
            --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            -r requirements-ml.txt

          python -m pip check

      - name: Verify ML Python runtime
        run: |
          python - <<'PY'
          import sys
          import numpy
          import pandas
          import sklearn

          try:
              import xgboost
              xgb = xgboost.__version__
          except Exception as exc:
              xgb = (
                  "optional-unavailable: "
                  + str(exc)
              )

          print(
              "PYTHON",
              sys.executable,
              sys.version
          )

          print(
              "NUMPY",
              numpy.__version__
          )

          print(
              "PANDAS",
              pandas.__version__
          )

          print(
              "SKLEARN",
              sklearn.__version__
          )

          print(
              "XGBOOST",
              xgb
          )
          PY

      - name: Validate V44 learning and safety fixtures
        run: |
          node --check update-data.mjs
          node --check build-ai-history.mjs
          node --check build-ai-learning.mjs
          node --check build-ai-journal.mjs
          node --check build-ai-governance.mjs
          node --check build-ai-shadow.mjs
          node --check adaptive-ai-v42.js

          python -m py_compile ai_provenance_v42.py
          python -m py_compile selfplay-lab.py
          python -m py_compile ml-train.py

          node tests/pipeline-closed-bars-v42.test.mjs
          node tests/shadow-feed-isolation-v42.test.mjs
          node tests/learning-closed-bars-v42.test.mjs
          node tests/history-provenance-v42.test.mjs
          node tests/governance-provenance-v42.test.mjs
          node tests/journal-forward-only-v43.test.mjs
          node tests/market-hours-dst-v43.test.mjs
          node tests/auto-hybrid-v44.test.mjs
          node tests/adaptive-ai-v42.test.cjs

          python tests/test_selfplay_promotion_v42.py
          python tests/test_ml_provenance_v42.py
          python tests/test_auto_hybrid_v44.py

      - name: Verify routed single-source training pack
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          routed = Path(
              'xauusd-training.json'
          )

          legacy = Path(
              'xauusd-primary.json'
          )

          path = (
              routed
              if routed.exists()
              else legacy
          )

          if not path.exists():
              raise SystemExit(
                  'No training pack exists'
              )

          pack = json.loads(
              path.read_text()
          )

          feed = (
              pack.get('feed')
              or {}
          )

          switching = (
              feed.get('switching')
              or {}
          )

          active = str(
              feed.get('active')
              or ''
          ).upper()

          training_feed = str(
              feed.get(
                  'trainingFeed'
              )
              or (
                  'TWELVE_DATA_PRIMARY'
                  if path.name ==
                  'xauusd-primary.json'
                  else ''
              )
          ).upper()

          training_source = str(
              feed.get(
                  'trainingSource'
              )
              or path.name
          )

          watermark = int(
              pack.get(
                  'closedBarWatermark'
              )
              or feed.get(
                  'closedBarWatermark'
              )
              or 0
          )

          if (
              switching.get(
                  'mergeFeeds'
              )
              is not False
          ):
              raise SystemExit(
                  'Feed merge forbidden'
              )

          if watermark <= 0:
              raise SystemExit(
                  'Training watermark missing'
              )

          allowed = {
              (
                  'xauusd-primary.json',
                  'TWELVE_DATA_PRIMARY'
              ),
              (
                  'xauusd-training.json',
                  'TWELVE_DATA_PRIMARY'
              ),
              (
                  'xauusd-training.json',
                  'MT5_ACADEMY'
              ),
          }

          pair = (
              training_source,
              training_feed
          )

          if pair not in allowed:
              raise SystemExit(
                  'Invalid V44 training pair: '
                  + str(pair)
              )

          if (
              training_feed ==
              'MT5_ACADEMY'
              and
              'MT5' not in active
          ):
              raise SystemExit(
                  'MT5 training feed/source mismatch'
              )

          if (
              training_feed ==
              'TWELVE_DATA_PRIMARY'
              and
              active !=
              'TWELVE_DATA'
          ):
              raise SystemExit(
                  'Twelve training feed/source mismatch'
              )

          timeframes = (
              pack.get(
                  'timeframes'
              )
              or {}
          )

          counts = {
              tf: len(
                  timeframes.get(tf)
                  or []
              )
              for tf in (
                  'M1',
                  'M5',
                  'M15',
                  'H1'
              )
          }

          print(
              'V44 TRAIN PACK',
              {
                  'file':
                      path.name,

                  'trainingSource':
                      training_source,

                  'trainingFeed':
                      training_feed,

                  'active':
                      active,

                  'counts':
                      counts,
              }
          )
          PY

      - name: Resolve current shadow outcomes
        run: |
          node build-ai-shadow.mjs

      - name: Rebuild routed historical brain
        run: |
          node build-ai-history.mjs

      - name: Train routed statistical challenger
        run: |
          node build-ai-learning.mjs

      - name: Resolve deployed signal and plan outcomes
        run: |
          node build-ai-journal.mjs

      - name: Champion challenger governance
        run: |
          node build-ai-governance.mjs

      - name: Source-aware self-play lab
        run: |
          python selfplay-lab.py

      - name: Train autonomous Python ML brain
        env:
          ML_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          python ml-train.py

      - name: Capture current-source shadow candidates
        run: |
          node build-ai-shadow.mjs

      - name: Journal qualified pending plans
        run: |
          node build-ai-journal.mjs

      - name: Verify V44 AI packs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          names = [
              'ai-history.json',
              'ai-learning.json',
              'ai-learning-candidate.json',
              'ai-model-governance.json',
              'ai-outcome-journal.json',
              'ai-ml-brain.json',
              'ai-ml-candidate.json',
              'ai-ml-governance.json',
              'ai-selfplay.json',
              'ai-thresholds.json',
              'ai-counterfactual.json',
              'ai-autopsy.json',
          ]

          for name in names:
              p = Path(name)

              if not p.exists():
                  continue

              text = p.read_text()

              if not text.strip():
                  raise SystemExit(
                      name +
                      ' is empty'
                  )

              json.loads(text)

          allowed = {
              (
                  'xauusd-primary.json',
                  'TWELVE_DATA_PRIMARY'
              ),
              (
                  'xauusd-training.json',
                  'TWELVE_DATA_PRIMARY'
              ),
              (
                  'xauusd-training.json',
                  'MT5_ACADEMY'
              ),
          }

          history_path = Path(
              'ai-history.json'
          )

          history = (
              json.loads(
                  history_path.read_text()
              )
              if history_path.exists()
              else {}
          )

          if (
              history.get('ready')
              is True
          ):
              provenance = (
                  history.get(
                      'artifactProvenance'
                  )
                  or {}
              )

              schema = (
                  history.get(
                      'artifactSchema'
                  )
                  or {}
              )

              pair = (
                  str(
                      provenance.get(
                          'trainingSource'
                      )
                      or ''
                  ),
                  str(
                      provenance.get(
                          'trainingFeed'
                      )
                      or ''
                  ).upper(),
              )

              if (
                  provenance.get(
                      'schemaVersion'
                  )
                  !=
                  'KAGE_AI_V42'
              ):
                  raise SystemExit(
                      'Ready history missing schema contract'
                  )

              if (
                  pair not in allowed
                  or
                  provenance.get(
                      'mergeFeeds'
                  )
                  is not False
              ):
                  raise SystemExit(
                      'Ready history violates source isolation: '
                      + str(pair)
                  )

              if (
                  provenance.get(
                      'featureSchemaHash'
                  )
                  !=
                  '17e82bd347b6f345ad289df1'
              ):
                  raise SystemExit(
                      'Ready history feature schema hash mismatch'
                  )

              if (
                  schema.get(
                      'featureSchemaHash'
                  )
                  !=
                  provenance.get(
                      'featureSchemaHash'
                  )
              ):
                  raise SystemExit(
                      'Ready history feature schema contract mismatch'
                  )

              if (
                  provenance.get(
                      'labelSchemaHash'
                  )
                  !=
                  'fffe7703ec24c8cac8851daa'
              ):
                  raise SystemExit(
                      'Ready history label schema hash mismatch'
                  )

              if (
                  schema.get(
                      'labelSchemaHash'
                  )
                  !=
                  provenance.get(
                      'labelSchemaHash'
                  )
              ):
                  raise SystemExit(
                      'Ready history label schema contract mismatch'
                  )

              if (
                  provenance.get(
                      'sourceFingerprint'
                  )
                  !=
                  history.get(
                      'sourceFingerprint'
                  )
              ):
                  raise SystemExit(
                      'Ready history source fingerprint mismatch'
                  )

              if not provenance.get(
                  'dataWatermark'
              ):
                  raise SystemExit(
                      'Ready history data watermark missing'
                  )

          ml_path = Path(
              'ai-ml-brain.json'
          )

          ml = (
              json.loads(
                  ml_path.read_text()
              )
              if ml_path.exists()
              else {}
          )

          isolation = (
              ml.get(
                  'dataIsolation'
              )
              or {}
          )

          if (
              isolation.get(
                  'mergeFeeds'
              )
              is True
          ):
              raise SystemExit(
                  'V44 policy violation: ML mergeFeeds true'
              )

          if (
              ml.get('ready')
              is True
          ):
              provenance = (
                  ml.get(
                      'artifactProvenance'
                  )
                  or {}
              )

              schema = (
                  ml.get(
                      'artifactSchema'
                  )
                  or {}
              )

              current = (
                  ml.get(
                      'current'
                  )
                  or {}
              )

              candidates = (
                  current.get(
                      'candidates'
                  )
                  or []
              )

              pair = (
                  str(
                      provenance.get(
                          'trainingSource'
                      )
                      or ''
                  ),
                  str(
                      provenance.get(
                          'trainingFeed'
                      )
                      or ''
                  ).upper(),
              )

              schema_version = (
                  provenance.get(
                      'schemaVersion'
                  )
                  or
                  schema.get(
                      'version'
                  )
              )

              if (
                  schema_version
                  !=
                  'KAGE_AI_V42'
              ):
                  raise SystemExit(
                      'Ready ML artifact missing schema contract'
                  )

              if (
                  pair not in allowed
                  or
                  provenance.get(
                      'mergeFeeds'
                  )
                  is not False
              ):
                  raise SystemExit(
                      'Ready ML artifact violates source isolation: '
                      + str(pair)
                  )

              required = (
                  'featureSchemaHash',
                  'labelSchemaHash',
                  'sourceFingerprint',
                  'dataWatermark'
              )

              for field in required:
                  if not provenance.get(
                      field
                  ):
                      raise SystemExit(
                          'Ready ML artifact missing '
                          + field
                      )

              if (
                  len(candidates)
                  != 12
              ):
                  raise SystemExit(
                      'Ready ML artifact must contain exactly 12 candidates'
                  )

              if (
                  current.get(
                      'candidateCount'
                  )
                  != 12
              ):
                  raise SystemExit(
                      'Ready ML candidateCount must equal 12'
                  )

          print(
              'V44 AI PACKS',
              {
                  'historyReady':
                      history.get(
                          'ready'
                      ),

                  'historyFeed':
                      (
                          history.get(
                              'artifactProvenance'
                          )
                          or {}
                      ).get(
                          'trainingFeed'
                      ),

                  'mlReady':
                      ml.get(
                          'ready'
                      ),

                  'mlStatus':
                      ml.get(
                          'status'
                      ),

                  'mlFeed':
                      (
                          ml.get(
                              'artifactProvenance'
                          )
                          or {}
                      ).get(
                          'trainingFeed'
                      ),

                  'trainingSource':
                      isolation.get(
                          'trainingSource'
                      ),

                  'liveSource':
                      isolation.get(
                          'liveSource'
                      ),
              }
          )
          PY

      - name: Commit V44 AI packs
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILES=(
            ai-history.json
            ai-learning.json
            ai-learning-candidate.json
            ai-learning-previous.json
            ai-model-governance.json
            ai-outcome-journal.json
            ai-ml-brain.json
            ai-ml-candidate.json
            ai-ml-governance.json
            ai-selfplay.json
            ai-thresholds.json
            ai-counterfactual.json
            ai-autopsy.json
          )

          SNAPSHOT="$(mktemp -d)"

          cleanup() {
            rm -rf "$SNAPSHOT"
          }

          trap cleanup EXIT

          for f in "${FILES[@]}"; do
            if [ -e "$f" ]; then
              cp -p \
                "$f" \
                "$SNAPSHOT/$f"
            fi
          done

          BRANCH="${GITHUB_REF_NAME}"

          for attempt in 1 2 3 4 5; do
            echo \
              "Publish attempt ${attempt}/5"

            git fetch \
              origin \
              "$BRANCH"

            git reset \
              --hard \
              "origin/$BRANCH"

            git clean -fd

            STAGE=()

            for f in "${FILES[@]}"; do
              if [
                -e "$SNAPSHOT/$f"
              ]; then
                cp -p \
                  "$SNAPSHOT/$f" \
                  "$f"

                STAGE+=("$f")
              fi
            done

            if [
              "${#STAGE[@]}" -eq 0
            ]; then
              echo \
                "No V44 AI artifacts produced"

              exit 0
            fi

            git add -- \
              "${STAGE[@]}"

            if \
              git diff \
                --cached \
                --quiet
            then
              echo \
                "Remote already contains these V44 AI artifacts"

              exit 0
            fi

            git commit \
              -m \
              "ai: V44 source-aware heavy self-play learning"

            if \
              git push origin \
                "HEAD:$BRANCH"
            then
              echo \
                "V44 AI artifacts published successfully"

              exit 0
            fi

            echo \
              "Remote changed while publishing. Retrying from latest branch..."

            sleep \
              $((attempt * 2))
          done

          echo \
            "ERROR: Could not publish V44 AI artifacts after 5 attempts"

          exit 1
