name: AI Background Learning

on:
  workflow_dispatch:

  # fallback เผื่อ data workflow ไม่ trigger
  schedule:
    - cron: "23 * * * *"

  # เรียนต่อทันทีหลังอัปเดตข้อมูลตลาด
  workflow_run:
    workflows:
      - "Update XAUUSD data pack"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: onemonth-ai-learning
  cancel-in-progress: true

jobs:
  learn:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate AI builders
        run: |
          node --check build-ai-history.mjs
          node --check build-ai-learning.mjs
          node --check build-ai-journal.mjs
          node --check build-ai-governance.mjs

      # 1. สร้าง Historical Brain
      - name: Rebuild rolling history brain
        run: node build-ai-history.mjs

      # 2. สร้าง Challenger จากข้อมูลล่าสุด
      - name: Train challenger model
        run: node build-ai-learning.mjs

      # 3. เช็กผล Signal/Pending Plan เก่าที่ครบเวลาแล้ว
      - name: Resolve deployed model outcomes
        run: node build-ai-journal.mjs

      # 4. Champion vs Challenger + Auto Rollback
      - name: Champion challenger governance
        run: node build-ai-governance.mjs

      # 5. บันทึก Pending Plan ของ Champion ปัจจุบัน
      - name: Journal newly deployed champion
        run: node build-ai-journal.mjs

      # 6. ตรวจไฟล์สมองทั้งหมดก่อน commit
      - name: Verify governed brain packs
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const read = (file) =>
            JSON.parse(fs.readFileSync(file, 'utf8'));

          const history = read('ai-history.json');
          const champion = read('ai-learning.json');
          const challenger = read('ai-learning-candidate.json');
          const governance = read('ai-model-governance.json');

          const journal =
            fs.existsSync('ai-outcome-journal.json')
              ? read('ai-outcome-journal.json')
              : null;

          if (!history.generatedAt) {
            throw new Error('ai-history.json missing generatedAt');
          }

          if (!champion.generatedAt) {
            throw new Error('ai-learning.json missing generatedAt');
          }

          if (!challenger.generatedAt) {
            throw new Error('ai-learning-candidate.json missing generatedAt');
          }

          if (!governance.updatedAt) {
            throw new Error('ai-model-governance.json missing updatedAt');
          }

          console.log('HISTORY', {
            ready: history.ready,
            candles: history.totalCandles,
            coverageDays: history.coverageDays
          });

          console.log('CHAMPION', {
            id: champion.modelId,
            engine: champion.engine,
            samples: champion.global?.samples,
            health: champion.modelHealth?.score
          });

          console.log('CHALLENGER', {
            id: challenger.modelId || challenger.sourceFingerprint,
            samples: challenger.global?.samples,
            health: challenger.modelHealth?.score
          });

          console.log('GOVERNANCE', {
            action: governance.action,
            championScore: governance.champion?.score,
            challengerScore: governance.challenger?.score,
            reason: governance.reason
          });

          console.log(
            'OUTCOME JOURNAL',
            journal?.summary || 'journal pending'
          );

          console.log(
            'PENDING PLAN JOURNAL',
            journal?.planSummary || 'pending-plan journal learning'
          );
          NODE

      # 7. Commit สมอง + Journal กลับเข้า GitHub
      - name: Commit governed brain and journal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for f in \
            ai-history.json \
            ai-learning.json \
            ai-learning-candidate.json \
            ai-learning-previous.json \
            ai-model-governance.json \
            ai-outcome-journal.json
          do
            if [ -e "$f" ]; then
              git add "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "No governed-model changes"
            exit 0
          fi

          git commit -m "ai: refresh V34.3 pending-plan brain"

          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
