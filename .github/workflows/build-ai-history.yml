name: AI Background Learning

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
  workflow_run:
    workflows:
      - "Update XAUUSD data pack"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: onemonth-ai-v38
  cancel-in-progress: true

jobs:
  learn:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ml.txt

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ml.txt

      - name: Validate V38 brain source
        run: |
          node --check build-ai-history.mjs
          node --check build-ai-learning.mjs
          node --check build-ai-journal.mjs
          node --check build-ai-governance.mjs
          node --check build-ai-shadow.mjs
          python -m py_compile selfplay-lab.py
          python -m py_compile ml-train.py

      - name: Verify PRIMARY training isolation
        run: |
          node - <<'NODE'
          const fs=require('fs');

          if(!fs.existsSync('xauusd-primary.json')){
            console.log('xauusd-primary.json not ready yet; Python brain may enter WAIT_DATA safely.');
          }else{
            const p=JSON.parse(fs.readFileSync('xauusd-primary.json','utf8'));
            console.log('PRIMARY TRAIN PACK:',p.feed?.active||p.source);
          }

          if(fs.existsSync('feed-health.json')){
            const h=JSON.parse(fs.readFileSync('feed-health.json','utf8'));

            if(h.switching?.mergeFeeds===true)
              throw new Error('Feed merge forbidden');

            console.log('LIVE ACTIVE:',h.active,h.mode,h.status);
          }
          NODE

      - name: Resolve shadow ideas with newest future M1
        run: node build-ai-shadow.mjs

      - name: Rebuild PRIMARY historical brain
        run: node build-ai-history.mjs

      - name: Train PRIMARY statistical challenger
        run: node build-ai-learning.mjs

      - name: Resolve deployed signal and plan outcomes
        run: node build-ai-journal.mjs

      - name: Statistical champion challenger governance
        run: node build-ai-governance.mjs

      - name: V38 self-play lab threshold counterfactual autopsy
        run: python selfplay-lab.py

      - name: Train V38 Python autonomous self-play precision brain
        env:
          ML_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python ml-train.py

      - name: Capture all 12 V38 candidates for next forward test
        run: node build-ai-shadow.mjs

      - name: Journal V38 qualified pending plans
        run: node build-ai-journal.mjs

      - name: Verify V38 packs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          names = [
              'ai-history.json',
              'ai-learning.json',
              'ai-learning-candidate.json',
              'ai-model-governance.json',
              'ai-outcome-journal.json',
              'ai-ml-brain.json',
              'ai-ml-candidate.json',
              'ai-ml-governance.json',
              'ai-shadow-journal.json',
              'ai-selfplay.json',
              'ai-thresholds.json',
              'ai-counterfactual.json',
              'ai-autopsy.json'
          ]

          for name in names:
              p=Path(name)
              if p.exists():
                  json.loads(p.read_text())

          ml=json.loads(
              Path('ai-ml-brain.json').read_text()
          ) if Path('ai-ml-brain.json').exists() else {}

          sp=ml.get('selfPlay') or {}

          print('V38',{
              'version':ml.get('version'),
              'ready':ml.get('ready'),
              'status':ml.get('status'),
              'health':(ml.get('modelHealth') or {}).get('score'),
              'trainingSource':(ml.get('dataIsolation') or {}).get('trainingSource'),
              'liveSource':(ml.get('dataIsolation') or {}).get('liveSource'),
              'mergeFeeds':(ml.get('dataIsolation') or {}).get('mergeFeeds'),
              'candidateCount':(ml.get('current') or {}).get('candidateCount'),
              'qualified':(ml.get('current') or {}).get('qualifiedCount'),
              'shadowTotal':(sp.get('shadow') or {}).get('total'),
              'shadowResolved':(sp.get('shadow') or {}).get('resolved'),
              'autoThreshold':(sp.get('thresholdOptimizer') or {}).get('active'),
              'counterfactualReady':(sp.get('counterfactual') or {}).get('ready'),
              'autopsyReady':(sp.get('autopsy') or {}).get('ready'),
          })

          if (ml.get('dataIsolation') or {}).get('mergeFeeds') is True:
              raise SystemExit('V38 policy violation: mergeFeeds true')
          PY

      - name: Commit V38 brain and self-play packs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for f in \
            ai-history.json \
            ai-learning.json \
            ai-learning-candidate.json \
            ai-learning-previous.json \
            ai-model-governance.json \
            ai-outcome-journal.json \
            ai-ml-brain.json \
            ai-ml-candidate.json \
            ai-ml-governance.json \
            ai-shadow-journal.json \
            ai-selfplay.json \
            ai-thresholds.json \
            ai-counterfactual.json \
            ai-autopsy.json
          do
            if [ -e "$f" ]; then
              git add "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "No V38 brain changes"
            exit 0
          fi

          git commit -m "ai: refresh V38 self-play precision brain"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
