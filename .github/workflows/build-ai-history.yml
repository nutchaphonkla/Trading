name: AI Background Learning

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
  workflow_run:
    workflows: ["Update XAUUSD data pack"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: onemonth-ai-learning
  cancel-in-progress: true

jobs:
  learn:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate AI builders
        run: |
          node --check build-ai-history.mjs
          node --check build-ai-learning.mjs

      - name: Rebuild recency-weighted history brain
        run: node build-ai-history.mjs

      - name: Train precision learning model
        run: node build-ai-learning.mjs

      - name: Verify learned brain files
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          for (const file of ['ai-history.json', 'ai-learning.json']) {
            if (!fs.existsSync(file)) throw new Error(`Missing ${file}`);
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log(file, {
              ready: data.ready,
              version: data.version,
              samples: data.global?.samples ?? data.totalCandles ?? 0,
              health: data.modelHealth?.score ?? data.global?.confidence ?? null,
              generatedAt: data.generatedAt
            });
          }
          NODE

      - name: Commit learned brain
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ai-history.json ai-learning.json

          if git diff --cached --quiet; then
            echo "No learned-model changes"
            exit 0
          fi

          git commit -m "ai: refresh V33 precision learning brain"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
