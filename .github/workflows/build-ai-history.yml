name: Build AI historical brain

on:
  workflow_dispatch:
  schedule:
    # Offset from typical market-data jobs to reduce git push collisions.
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: ai-history-build
  cancel-in-progress: true

jobs:
  build-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build historical AI pack
        run: node build-ai-history.mjs

      - name: Commit AI history pack
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-history.json
          if git diff --cached --quiet; then
            echo "No AI history changes"
            exit 0
          fi
          git commit -m "Update AI historical brain"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
