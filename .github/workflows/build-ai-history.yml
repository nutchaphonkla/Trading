name: AI Background Learning

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
  workflow_run:
    workflows:
      - "Update XAUUSD data pack"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: kage-v44-repo-writer
  cancel-in-progress: false

jobs:
  learn:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Hard sync latest V44 data snapshot
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          echo "AI checkout: $(git rev-parse HEAD)"

      - name: Lock routed training source for this run
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          health = json.loads(Path('feed-health.json').read_text())
          pack = json.loads(Path('xauusd-training.json').read_text())
          model = (
              json.loads(Path('ai-ml-brain.json').read_text())
              if Path('ai-ml-brain.json').exists()
              else {}
          )

          expected = str(
              (health.get('training') or {}).get('feed') or ''
          ).upper()

          actual = str(
              (pack.get('feed') or {}).get('trainingFeed') or ''
          ).upper()

          model_feed = str(
              (model.get('artifactProvenance') or {}).get('trainingFeed') or ''
          ).upper()

          counts = {
              tf: len((pack.get('timeframes') or {}).get(tf) or [])
              for tf in ('M1', 'M5', 'M15', 'H1')
          }

          print('ROUTER TRAINING:', expected)
          print('PACK TRAINING:', actual)
          print('MODEL TRAINING:', model_feed or 'NONE')
          print('TRAINING COUNTS:', counts)

          if expected not in {
              'MT5_ACADEMY',
              'TWELVE_DATA_PRIMARY'
          }:
              raise SystemExit(
                  f'Invalid router training feed: {expected or "MISSING"}'
              )

          if actual != expected:
              raise SystemExit(
                  f'Stale training pack: router={expected} pack={actual}'
              )

          if (
              expected == 'MT5_ACADEMY'
              and (
                  counts['M1'] < 1800
                  or counts['M15'] < 420
              )
          ):
              raise SystemExit(
                  f'MT5 academy archive unexpectedly short: {counts}'
              )

          force = (
              '1'
              if model_feed != actual
              else '0'
          )

          with open(
              Path(os.environ['GITHUB_ENV']),
              'a',
              encoding='utf-8'
          ) as f:
              f.write(
                  f'KAGE_TRAINING_FEED={actual}\n'
              )
              f.write(
                  f'KAGE_FORCE_SOURCE_HANDOFF={force}\n'
              )

          print(
              'SOURCE HANDOFF FORCE:',
              force
          )
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ml.txt

      - name: Install ML dependencies
        run: |
          python -V
          python -m pip --version
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-ml.txt
          python -m pip check

      - name: Verify ML Python runtime
        run: |
          python - <<'PY'
          import sys
          import numpy
          import pandas
          import sklearn

          try:
              import xgboost
              xgb = xgboost.__version__
          except Exception as exc:
              xgb = f"optional-unavailable: {exc}"

          print("PYTHON", sys.executable, sys.version)
          print("NUMPY", numpy.__version__)
          print("PANDAS", pandas.__version__)
          print("SKLEARN", sklearn.__version__)
          print("XGBOOST", xgb)
          PY

      - name: Validate V44 learning and safety fixtures
        run: |
          node --check update-data.mjs
          node --check build-ai-history.mjs
          node --check build-ai-learning.mjs
          node --check build-ai-journal.mjs
          node --check build-ai-governance.mjs
          node --check build-ai-shadow.mjs
          node --check adaptive-ai-v42.js

          python -m py_compile ai_provenance_v42.py
          python -m py_compile selfplay-lab.py
          python -m py_compile ml-train.py

          node tests/pipeline-closed-bars-v42.test.mjs
          node tests/shadow-feed-isolation-v42.test.mjs
          node tests/learning-closed-bars-v42.test.mjs
          node tests/history-provenance-v42.test.mjs
          node tests/governance-provenance-v42.test.mjs
          node tests/journal-forward-only-v43.test.mjs
          node tests/market-hours-dst-v43.test.mjs
          node tests/auto-hybrid-v44.test.mjs
          node tests/adaptive-ai-v42.test.cjs

          python tests/test_selfplay_promotion_v42.py
          python tests/test_ml_provenance_v42.py
          python tests/test_auto_hybrid_v44.py

      - name: Verify routed single-source training pack
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          routed = Path('xauusd-training.json')
          legacy = Path('xauusd-primary.json')

          path = (
              routed
              if routed.exists()
              else legacy
          )

          if not path.exists():
              raise SystemExit(
                  'No training pack exists'
              )

          pack = json.loads(
              path.read_text()
          )

          feed = (
              pack.get('feed')
              or {}
          )

          switching = (
              feed.get('switching')
              or {}
          )

          active = str(
              feed.get('active')
              or ''
          ).upper()

          training_feed = str(
              feed.get('trainingFeed')
              or (
                  'TWELVE_DATA_PRIMARY'
                  if path.name ==
                  'xauusd-primary.json'
                  else ''
              )
          ).upper()

          training_source = str(
              feed.get('trainingSource')
              or path.name
          )

          watermark = int(
              pack.get('closedBarWatermark')
              or feed.get('closedBarWatermark')
              or 0
          )

          if switching.get('mergeFeeds') is not False:
              raise SystemExit(
                  'Feed merge forbidden'
              )

          if watermark <= 0:
              raise SystemExit(
                  'Training watermark missing'
              )

          allowed = {
              (
                  'xauusd-primary.json',
                  'TWELVE_DATA_PRIMARY'
              ),
              (
                  'xauusd-training.json',
                  'TWELVE_DATA_PRIMARY'
              ),
              (
                  'xauusd-training.json',
                  'MT5_ACADEMY'
              ),
          }

          if (
              training_source,
              training_feed
          ) not in allowed:
              raise SystemExit(
                  f'Invalid V44 training pair: '
                  f'{training_source} | '
                  f'{training_feed}'
              )

          if (
              training_feed == 'MT5_ACADEMY'
              and 'MT5' not in active
          ):
              raise SystemExit(
                  'MT5 training feed/source mismatch'
              )

          if (
              training_feed == 'TWELVE_DATA_PRIMARY'
              and active != 'TWELVE_DATA'
          ):
              raise SystemExit(
                  'Twelve training feed/source mismatch'
              )

          counts = {
              tf: len(
                  (
                      pack.get('timeframes')
                      or {}
                  ).get(tf)
                  or []
              )
              for tf in (
                  'M1',
                  'M5',
                  'M15',
                  'H1'
              )
          }

          print(
              'V44 TRAIN PACK',
              {
                  'file':
                      path.name,
                  'trainingSource':
                      training_source,
                  'trainingFeed':
                      training_feed,
                  'active':
                      active,
                  'counts':
                      counts,
              }
          )
          PY

      - name: Resolve current shadow outcomes
        run: node build-ai-shadow.mjs

      - name: Rebuild routed historical brain
        run: node build-ai-history.mjs

      - name: Train routed statistical challenger
        run: node build-ai-learning.mjs

      - name: Resolve deployed signal and plan outcomes
        run: node build-ai-journal.mjs

      - name: Champion challenger governance
        run: node build-ai-governance.mjs

      - name: Source-aware self-play lab
        run: python selfplay-lab.py

      - name: Train autonomous Python ML brain
        shell: bash
        run: |
          set -euo pipefail

          FORCE=0

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FORCE=1
          fi

          if [ "${KAGE_FORCE_SOURCE_HANDOFF:-0}" = "1" ]; then
            FORCE=1
          fi

          echo \
            "ML_FORCE=${FORCE} | routed feed=${KAGE_TRAINING_FEED:-UNKNOWN}"

          ML_FORCE="$FORCE" \
            python ml-train.py

      - name: Verify ML consumed routed training source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(
              Path('feed-health.json').read_text()
          )

          pack = json.loads(
              Path('xauusd-training.json').read_text()
          )

          model = json.loads(
              Path('ai-ml-brain.json').read_text()
          )

          expected = str(
              (health.get('training') or {}).get('feed') or ''
          ).upper()

          pack_feed = str(
              (pack.get('feed') or {}).get('trainingFeed') or ''
          ).upper()

          prov = (
              model.get('artifactProvenance')
              or {}
          )

          model_feed = str(
              prov.get('trainingFeed')
              or ''
          ).upper()

          model_source = str(
              prov.get('trainingSource')
              or ''
          )

          print('EXPECTED:', expected)
          print('PACK:', pack_feed)
          print(
              'MODEL:',
              model_feed,
              model_source
          )
          print(
              'MODEL STATUS:',
              model.get('status'),
              'READY:',
              model.get('ready')
          )

          if expected != pack_feed:
              raise SystemExit(
                  f'Router/pack mismatch: '
                  f'{expected} != {pack_feed}'
              )

          if (
              model_feed != expected
              or model_source !=
              'xauusd-training.json'
          ):
              raise SystemExit(
                  'ML did not consume current routed pack: '
                  f'expected={expected} '
                  f'actual={model_feed} '
                  f'source={model_source}'
              )

          if (
              expected == 'MT5_ACADEMY'
              and model.get('reason') ==
              'TRAINING_PACK_NOT_READY'
          ):
              raise SystemExit(
                  'Stale API bootstrap artifact survived '
                  'MT5 academy training'
              )
          PY

      - name: Capture current-source shadow candidates
        run: node build-ai-shadow.mjs

      - name: Journal qualified pending plans
        run: node build-ai-journal.mjs

      - name: Verify V44 AI packs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          names = [
              'ai-history.json',
              'ai-learning.json',
              'ai-learning-candidate.json',
              'ai-model-governance.json',
              'ai-outcome-journal.json',
              'ai-ml-brain.json',
              'ai-ml-candidate.json',
              'ai-ml-governance.json',
              'ai-selfplay.json',
              'ai-thresholds.json',
              'ai-counterfactual.json',
              'ai-autopsy.json',
          ]

          for name in names:
              p = Path(name)

              if p.exists():
                  text = p.read_text()

                  if not text.strip():
                      raise SystemExit(
                          f'{name} is empty'
                      )

                  json.loads(text)

          allowed = {
              (
                  'xauusd-primary.json',
                  'TWELVE_DATA_PRIMARY'
              ),
              (
                  'xauusd-training.json',
                  'TWELVE_DATA_PRIMARY'
              ),
              (
                  'xauusd-training.json',
                  'MT5_ACADEMY'
              ),
          }

          history = (
              json.loads(
                  Path(
                      'ai-history.json'
                  ).read_text()
              )
              if Path(
                  'ai-history.json'
              ).exists()
              else {}
          )

          if history.get('ready') is True:
              p = (
                  history.get(
                      'artifactProvenance'
                  )
                  or {}
              )

              schema = (
                  history.get(
                      'artifactSchema'
                  )
                  or {}
              )

              pair = (
                  str(
                      p.get(
                          'trainingSource'
                      )
                      or ''
                  ),
                  str(
                      p.get(
                          'trainingFeed'
                      )
                      or ''
                  ).upper(),
              )

              if (
                  p.get('schemaVersion')
                  != 'KAGE_AI_V42'
              ):
                  raise SystemExit(
                      'Ready history missing schema contract'
                  )

              if (
                  pair not in allowed
                  or p.get('mergeFeeds')
                  is not False
              ):
                  raise SystemExit(
                      f'Ready history violates '
                      f'source isolation: {pair}'
                  )

              if (
                  p.get('featureSchemaHash')
                  !=
                  '17e82bd347b6f345ad289df1'
                  or schema.get(
                      'featureSchemaHash'
                  )
                  != p.get(
                      'featureSchemaHash'
                  )
              ):
                  raise SystemExit(
                      'Ready history feature schema mismatch'
                  )

              if (
                  p.get('labelSchemaHash')
                  !=
                  'fffe7703ec24c8cac8851daa'
                  or schema.get(
                      'labelSchemaHash'
                  )
                  != p.get(
                      'labelSchemaHash'
                  )
              ):
                  raise SystemExit(
                      'Ready history label schema mismatch'
                  )

              if (
                  p.get('sourceFingerprint')
                  != history.get(
                      'sourceFingerprint'
                  )
                  or not p.get(
                      'dataWatermark'
                  )
              ):
                  raise SystemExit(
                      'Ready history provenance mismatch'
                  )

          ml = (
              json.loads(
                  Path(
                      'ai-ml-brain.json'
                  ).read_text()
              )
              if Path(
                  'ai-ml-brain.json'
              ).exists()
              else {}
          )

          isolation = (
              ml.get('dataIsolation')
              or {}
          )

          if (
              isolation.get('mergeFeeds')
              is True
          ):
              raise SystemExit(
                  'V44 policy violation: ML mergeFeeds true'
              )

          if ml.get('ready') is True:
              p = (
                  ml.get(
                      'artifactProvenance'
                  )
                  or {}
              )

              schema = (
                  ml.get(
                      'artifactSchema'
                  )
                  or {}
              )

              current = (
                  ml.get('current')
                  or {}
              )

              candidates = (
                  current.get('candidates')
                  or []
              )

              pair = (
                  str(
                      p.get(
                          'trainingSource'
                      )
                      or ''
                  ),
                  str(
                      p.get(
                          'trainingFeed'
                      )
                      or ''
                  ).upper(),
              )

              if (
                  (
                      p.get('schemaVersion')
                      or schema.get('version')
                  )
                  != 'KAGE_AI_V42'
              ):
                  raise SystemExit(
                      'Ready ML artifact missing schema contract'
                  )

              if (
                  pair not in allowed
                  or p.get('mergeFeeds')
                  is not False
              ):
                  raise SystemExit(
                      f'Ready ML artifact violates '
                      f'source isolation: {pair}'
                  )

              for field in (
                  'featureSchemaHash',
                  'labelSchemaHash',
                  'sourceFingerprint',
                  'dataWatermark'
              ):
                  if not p.get(field):
                      raise SystemExit(
                          f'Ready ML artifact missing {field}'
                      )

              if (
                  len(candidates) != 12
                  or current.get(
                      'candidateCount'
                  ) != 12
              ):
                  raise SystemExit(
                      'Ready ML artifact must contain '
                      'exactly 12 candidates'
                  )

          print(
              'V44 AI PACKS',
              {
                  'historyReady':
                      history.get('ready'),
                  'historyFeed':
                      (
                          history.get(
                              'artifactProvenance'
                          )
                          or {}
                      ).get(
                          'trainingFeed'
                      ),
                  'mlReady':
                      ml.get('ready'),
                  'mlStatus':
                      ml.get('status'),
                  'mlFeed':
                      (
                          ml.get(
                              'artifactProvenance'
                          )
                          or {}
                      ).get(
                          'trainingFeed'
                      ),
                  'trainingSource':
                      isolation.get(
                          'trainingSource'
                      ),
                  'liveSource':
                      isolation.get(
                          'liveSource'
                      ),
              }
          )
          PY

      - name: Commit V44 AI packs
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILES=(
            ai-history.json
            ai-learning.json
            ai-learning-candidate.json
            ai-learning-previous.json
            ai-model-governance.json
            ai-outcome-journal.json
            ai-ml-brain.json
            ai-ml-candidate.json
            ai-ml-governance.json
            ai-shadow-journal.json
            ai-selfplay.json
            ai-thresholds.json
            ai-counterfactual.json
            ai-autopsy.json
          )

          SNAPSHOT="$(mktemp -d)"

          trap \
            'rm -rf "$SNAPSHOT"' \
            EXIT

          for f in "${FILES[@]}"; do
            if [ -e "$f" ]; then
              cp -p \
                "$f" \
                "$SNAPSHOT/$f"
            fi
          done

          BRANCH="${TARGET_BRANCH:-main}"

          for attempt in 1 2 3 4 5; do
            echo \
              "Publish attempt ${attempt}/5 -> ${BRANCH}"

            git fetch \
              origin \
              "$BRANCH"

            git reset \
              --hard \
              "origin/$BRANCH"

            git clean -fd

            STAGE=()

            for f in "${FILES[@]}"; do
              if [
                -e "$SNAPSHOT/$f"
              ]; then
                cp -p \
                  "$SNAPSHOT/$f" \
                  "$f"

                STAGE+=("$f")
              fi
            done

            if [
              "${#STAGE[@]}" -eq 0
            ]; then
              echo \
                "No V44 AI artifacts produced"

              exit 0
            fi

            git add -- \
              "${STAGE[@]}"

            if \
              git diff \
                --cached \
                --quiet
            then
              echo \
                "Remote already contains these V44 AI artifacts"

              exit 0
            fi

            git commit \
              -m \
              "ai: V44 source-aware heavy self-play learning"

            if \
              git push \
                origin \
                "HEAD:$BRANCH"
            then
              echo \
                "V44 AI artifacts published successfully"

              exit 0
            fi

            echo \
              "Remote changed while publishing; rebuilding commit from latest ${BRANCH}"

            sleep \
              $((attempt * 2))
          done

          echo \
            "ERROR: Could not publish V44 AI artifacts after 5 attempts"

          exit 1
