name: AI Background Learning

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
  workflow_run:
    workflows:
      - "Update XAUUSD data pack"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: kage-ai-v43
  cancel-in-progress: true

jobs:
  learn:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    timeout-minutes: 40

    steps:

      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Show checked out commit
        run: |
          echo "COMMIT:"
          git rev-parse HEAD

          echo "BRANCH:"
          git branch --show-current || true

          echo "UPDATE DATA EXPORTS:"
          grep -n "export function aggregate" update-data.mjs
          grep -n "export function closedBars" update-data.mjs
          grep -n "export function sourcePackFromM1" update-data.mjs


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ml.txt


      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ml.txt


      - name: Verify update-data exports
        run: |
          node --input-type=module <<'NODE'
          import * as updateData from './update-data.mjs';

          const required = [
            'aggregate',
            'closedBars',
            'sourcePackFromM1'
          ];

          for (const name of required) {
            if (typeof updateData[name] !== 'function') {
              throw new Error(
                `update-data.mjs missing export: ${name}`
              );
            }

            console.log(
              `OK export: ${name}`
            );
          }

          console.log(
            'update-data exports verified'
          );
          NODE


      - name: Validate V42 brain source and safety fixtures
        run: |
          node --check update-data.mjs
          node --check build-ai-history.mjs
          node --check build-ai-learning.mjs
          node --check build-ai-journal.mjs
          node --check build-ai-governance.mjs
          node --check build-ai-shadow.mjs

          python -m py_compile selfplay-lab.py
          python -m py_compile ml-train.py

          node tests/pipeline-closed-bars-v42.test.mjs
          node tests/shadow-feed-isolation-v42.test.mjs
          node tests/learning-closed-bars-v42.test.mjs
          node tests/history-provenance-v42.test.mjs
          node tests/governance-provenance-v42.test.mjs

          python tests/test_selfplay_promotion_v42.py
          python tests/test_ml_provenance_v42.py


      - name: Verify PRIMARY training isolation
        run: |
          node - <<'NODE'
          const fs = require('fs');

          if (!fs.existsSync('xauusd-primary.json')) {

            console.log(
              'xauusd-primary.json not ready yet; Python brain may enter WAIT_DATA safely.'
            );

          } else {

            const pack =
              JSON.parse(
                fs.readFileSync(
                  'xauusd-primary.json',
                  'utf8'
                )
              );

            console.log(
              'PRIMARY TRAIN PACK:',
              pack.feed?.active ||
              pack.source
            );
          }

          if (
            fs.existsSync(
              'feed-health.json'
            )
          ) {

            const health =
              JSON.parse(
                fs.readFileSync(
                  'feed-health.json',
                  'utf8'
                )
              );

            if (
              health.switching
                ?.mergeFeeds === true
            ) {

              throw new Error(
                'Feed merge forbidden'
              );
            }

            console.log(
              'LIVE ACTIVE:',
              health.active,
              health.mode,
              health.status
            );
          }
          NODE


      - name: Resolve shadow ideas with newest future M1
        run: |
          node build-ai-shadow.mjs


      - name: Rebuild PRIMARY historical brain
        run: |
          node build-ai-history.mjs


      - name: Train PRIMARY statistical challenger
        run: |
          node build-ai-learning.mjs


      - name: Resolve deployed signal and plan outcomes
        run: |
          node build-ai-journal.mjs


      - name: Statistical champion challenger governance
        run: |
          node build-ai-governance.mjs


      - name: Self-play lab threshold counterfactual autopsy
        run: |
          python selfplay-lab.py


      - name: Train Python autonomous self-play precision brain
        env:
          ML_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}

        run: |
          python ml-train.py


      - name: Capture all candidates for next forward test
        run: |
          node build-ai-shadow.mjs


      - name: Journal qualified pending plans
        run: |
          node build-ai-journal.mjs


      - name: Verify generated JSON packs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          names = [
              'ai-history.json',
              'ai-learning.json',
              'ai-learning-candidate.json',
              'ai-model-governance.json',
              'ai-outcome-journal.json',
              'ai-ml-brain.json',
              'ai-ml-candidate.json',
              'ai-ml-governance.json',
              'ai-shadow-journal.json',
              'ai-selfplay.json',
              'ai-thresholds.json',
              'ai-counterfactual.json',
              'ai-autopsy.json'
          ]

          for name in names:

              path = Path(name)

              if path.exists():

                  json.loads(
                      path.read_text()
                  )

                  print(
                      'VALID JSON:',
                      name
                  )

          if Path(
              'ai-ml-brain.json'
          ).exists():

              ml = json.loads(
                  Path(
                      'ai-ml-brain.json'
                  ).read_text()
              )

              isolation = (
                  ml.get(
                      'dataIsolation'
                  )
                  or {}
              )

              if (
                  isolation.get(
                      'mergeFeeds'
                  )
                  is True
              ):

                  raise SystemExit(
                      'Policy violation: mergeFeeds true'
                  )

              print(
                  'ML STATUS:',
                  ml.get(
                      'status'
                  )
              )

              print(
                  'ML READY:',
                  ml.get(
                      'ready'
                  )
              )

          print(
              'JSON verification complete'
          )
          PY


      - name: Commit AI brain packs
        shell: bash

        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for f in \
            ai-history.json \
            ai-learning.json \
            ai-learning-candidate.json \
            ai-learning-previous.json \
            ai-model-governance.json \
            ai-outcome-journal.json \
            ai-ml-brain.json \
            ai-ml-candidate.json \
            ai-ml-governance.json \
            ai-shadow-journal.json \
            ai-selfplay.json \
            ai-thresholds.json \
            ai-counterfactual.json \
            ai-autopsy.json
          do

            if [ -e "$f" ]; then
              git add "$f"
            fi

          done


          if git diff --cached --quiet; then

            echo "No AI brain changes"

            exit 0

          fi


          git commit \
            -m "ai: refresh KAGE precision brain"


          git pull \
            --rebase \
            origin \
            "${GITHUB_REF_NAME}"


          git push \
            origin \
            "HEAD:${GITHUB_REF_NAME}"
