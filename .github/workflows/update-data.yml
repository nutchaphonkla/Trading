name: Update XAUUSD data pack

on:
  workflow_dispatch:

  schedule:
    # จันทร์-ศุกร์ ทุก 10 นาที
    - cron: "*/10 * * * 1-5"

    # ช่วงตลาดเริ่มกลับมาเปิดวันอาทิตย์ UTC
    - cron: "*/10 21-23 * * 0"

permissions:
  contents: write

concurrency:
  group: onemonth-market-data-v362
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate V36.2 primary failover updater
        run: node --check update-data.mjs

      - name: Update XAUUSD primary or fallback pack
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TV_FALLBACK_URL: ${{ secrets.TV_FALLBACK_URL }}
          TV_FALLBACK_TOKEN: ${{ secrets.TV_FALLBACK_TOKEN }}
        run: node update-data.mjs

      - name: Print active feed
        run: |
          node - <<'NODE'
          const fs = require("fs");

          if (!fs.existsSync("feed-health.json")) {
            throw new Error("feed-health.json missing");
          }

          const h = JSON.parse(
            fs.readFileSync("feed-health.json", "utf8")
          );

          console.log("====================================");
          console.log("ONEMONTH V36.2 FEED HEALTH");
          console.log("====================================");

          console.log(
            "ACTIVE FEED:",
            h.active || "UNKNOWN"
          );

          console.log(
            "MODE:",
            h.mode || "UNKNOWN"
          );

          console.log(
            "STATUS:",
            h.status || "UNKNOWN"
          );

          console.log(
            "REASON:",
            h.reason || "-"
          );

          console.log(
            "PRIMARY:",
            h.primary?.status || "UNKNOWN",
            h.primary?.error || "OK"
          );

          console.log(
            "MT5 FALLBACK:",
            h.fallback?.checked
              ? h.fallback?.status || "UNKNOWN"
              : "STANDBY / NOT QUERIED"
          );

          console.log(
            "PRIMARY RECOVERY:",
            `${h.switching?.primaryRecoveryStreak || 0}/${h.switching?.primaryRecoveryRequired || 2}`
          );

          console.log(
            "MERGE FEEDS:",
            h.switching?.mergeFeeds === true
              ? "ERROR - SHOULD BE FALSE"
              : "FALSE"
          );

          if (h.switching?.mergeFeeds === true) {
            throw new Error(
              "V36.2 policy violation: feeds must never be merged"
            );
          }

          console.log("====================================");
          NODE

      - name: Commit market data and feed health
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            xauusd.json \
            news.json \
            feed-health.json

          if git diff --cached --quiet; then
            echo "No market-data changes"
            exit 0
          fi

          git commit -m "data: update V36.2 primary failover pack"

          git pull --rebase origin "${GITHUB_REF_NAME}"

          git push origin "HEAD:${GITHUB_REF_NAME}"
