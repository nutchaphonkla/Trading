name: Update XAUUSD data pack

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * 1-5"
    - cron: "*/10 21-23 * * 0"

permissions:
  contents: write

concurrency:
  group: kage-v44-repo-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate V44 auto-hybrid data engines
        run: |
          node --check update-data.mjs
          node --check build-ai-shadow.mjs

          node tests/pipeline-closed-bars-v42.test.mjs
          node tests/shadow-feed-isolation-v42.test.mjs
          node tests/auto-hybrid-v44.test.mjs

      - name: Auto route MT5 HEAVY or Twelve Data ECO
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TV_FALLBACK_URL: ${{ secrets.TV_FALLBACK_URL }}
          TV_FALLBACK_TOKEN: ${{ secrets.TV_FALLBACK_TOKEN }}
        run: node update-data.mjs

      - name: Current-market shadow self-play
        run: node build-ai-shadow.mjs

      - name: Verify V44 source isolation and closed bars
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const read = file =>
            JSON.parse(
              fs.readFileSync(file, 'utf8')
            );

          const health = read(
            'feed-health.json'
          );

          const activePack = read(
            'xauusd.json'
          );

          const trainingPack = read(
            'xauusd-training.json'
          );

          console.log(
            'V44 ROUTER',
            {
              active:
                health.active,

              mode:
                health.mode,

              status:
                health.status,

              training:
                health.training,

              requests:
                health.efficiency,

              reason:
                health.reason,
            }
          );

          if (
            health.switching?.mergeFeeds
            !== false
          ) {
            throw new Error(
              'V44 policy violation: feed isolation must be explicit'
            );
          }

          const watermark =
            Number(
              activePack.closedBarWatermark ||
              activePack.feed
                ?.closedBarWatermark ||
              0
            );

          if (!(watermark > 0)) {
            throw new Error(
              'V44 policy violation: active closed-bar watermark missing'
            );
          }

          const widths = {
            M1: 60000,
            M5: 300000,
            M15: 900000,
            H1: 3600000,
          };

          for (
            const [tf, width]
            of Object.entries(widths)
          ) {
            const bars =
              activePack.timeframes?.[tf] ||
              [];

            const open =
              bars.find(
                bar =>
                  Number(bar.ts) +
                  width >
                  watermark
              );

            if (open) {
              throw new Error(
                `V44 policy violation: ${tf} contains an unclosed bar at ${open.ts}`
              );
            }
          }

          const tfeed =
            String(
              trainingPack.feed
                ?.trainingFeed ||
              ''
            ).toUpperCase();

          const tsource =
            String(
              trainingPack.feed
                ?.trainingSource ||
              ''
            );

          const tactive =
            String(
              trainingPack.feed
                ?.active ||
              ''
            ).toUpperCase();

          const tmerge =
            trainingPack.feed
              ?.switching
              ?.mergeFeeds;

          const allowed =
            new Set([
              'TWELVE_DATA_PRIMARY',
              'MT5_ACADEMY',
            ]);

          if (
            tsource !==
            'xauusd-training.json'
          ) {
            throw new Error(
              `V44 training source path mismatch: ${tsource || 'MISSING'}`
            );
          }

          if (!allowed.has(tfeed)) {
            throw new Error(
              `V44 training feed invalid: ${tfeed || 'MISSING'}`
            );
          }

          if (tmerge !== false) {
            throw new Error(
              'V44 training pack may never merge source candles'
            );
          }

          if (
            tfeed === 'MT5_ACADEMY' &&
            !tactive.includes('MT5')
          ) {
            throw new Error(
              'V44 MT5 training provenance mismatch'
            );
          }

          if (
            tfeed ===
              'TWELVE_DATA_PRIMARY' &&
            tactive !==
              'TWELVE_DATA'
          ) {
            throw new Error(
              'V44 Twelve training provenance mismatch'
            );
          }

          if (
            health.active ===
              'MT5_FALLBACK' &&
            tfeed !==
              'MT5_ACADEMY'
          ) {
            throw new Error(
              'V44 active MT5 must route MT5 academy training'
            );
          }

          if (
            health.active ===
              'TWELVE_DATA' &&
            tfeed !==
              'TWELVE_DATA_PRIMARY'
          ) {
            throw new Error(
              'V44 active Twelve must route Twelve training'
            );
          }

          const twelveRequests =
            Number(
              health.efficiency
                ?.twelveRequestsThisRun ||
              0
            );

          if (
            health.mode ===
              'MT5_HEAVY' &&
            health.fallback
              ?.connected === true &&
            twelveRequests !== 0
          ) {
            throw new Error(
              `V44 ECO violation: healthy MT5 HEAVY run used ${twelveRequests} Twelve request(s)`
            );
          }

          const files = [
            'xauusd.json',
            'xauusd-training.json',
            'feed-health.json',
            'ai-shadow-journal.json',
          ];

          for (const file of files) {
            const text =
              fs.readFileSync(
                file,
                'utf8'
              );

            if (!text.trim()) {
              throw new Error(
                `${file} is empty`
              );
            }

            JSON.parse(text);
          }

          console.log(
            'V44 source isolation: PASS'
          );
          NODE

      - name: Commit V44 market router packs
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILES=(
            xauusd.json
            xauusd-primary.json
            xauusd-fallback.json
            xauusd-training.json
            news.json
            feed-health.json
            ai-shadow-journal.json
          )

          SNAPSHOT="$(mktemp -d)"

          cleanup() {
            rm -rf "$SNAPSHOT"
          }

          trap cleanup EXIT

          for f in "${FILES[@]}"; do
            if [ -e "$f" ]; then
              cp -p "$f" "$SNAPSHOT/$f"
            fi
          done

          BRANCH="${GITHUB_REF_NAME}"

          for attempt in 1 2 3 4 5; do
            echo "Publish attempt ${attempt}/5"

            git fetch origin "$BRANCH"

            git reset --hard \
              "origin/$BRANCH"

            git clean -fd

            STAGE=()

            for f in "${FILES[@]}"; do
              if [ -e "$SNAPSHOT/$f" ]; then
                cp -p \
                  "$SNAPSHOT/$f" \
                  "$f"

                STAGE+=("$f")
              fi
            done

            if [
              "${#STAGE[@]}" -eq 0
            ]; then
              echo \
                "No V44 market artifacts produced"

              exit 0
            fi

            git add -- \
              "${STAGE[@]}"

            if \
              git diff \
                --cached \
                --quiet
            then
              echo \
                "Remote already contains these V44 market artifacts"

              exit 0
            fi

            git commit \
              -m \
              "data: V44 auto-hybrid MT5/API router"

            if \
              git push origin \
                "HEAD:$BRANCH"
            then
              echo \
                "V44 market artifacts published successfully"

              exit 0
            fi

            echo \
              "Remote changed while publishing. Retrying from latest branch..."

            sleep \
              $((attempt * 2))
          done

          echo \
            "ERROR: Could not publish V44 market artifacts after 5 attempts"

          exit 1
