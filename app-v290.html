<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#02070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="OneMonth OS">
<title>OneMonth OS · Redirecting</title>
<style>
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#02070b;
  color:#eef4f7;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
body{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:28px;
  box-sizing:border-box;
}
.wrap{
  width:min(360px,100%);
  text-align:center;
}
.logo{
  width:72px;
  height:72px;
  margin:0 auto 22px;
  border-radius:22px;
  display:grid;
  place-items:center;
  border:1px solid rgba(103,207,239,.25);
  background:#07131b;
  box-shadow:0 0 42px rgba(91,211,237,.12);
  font-size:30px;
}
.kicker{
  color:#6ee7c3;
  font-size:11px;
  font-weight:900;
  letter-spacing:.18em;
}
h1{
  margin:10px 0 8px;
  font-size:24px;
}
p{
  margin:0;
  color:#8393a0;
  font-size:13px;
  line-height:1.7;
}
.bar{
  height:7px;
  margin-top:24px;
  border-radius:999px;
  overflow:hidden;
  background:#0a1720;
}
.bar i{
  display:block;
  width:25%;
  height:100%;
  border-radius:inherit;
  background:linear-gradient(90deg,#63c7f0,#6ee7c3);
  animation:load 1s ease-in-out infinite alternate;
}
.version{
  margin-top:14px;
  color:#7f8e9a;
  font-size:10px;
  font-weight:800;
  letter-spacing:.12em;
}
@keyframes load{
  from{width:18%}
  to{width:100%}
}
</style>
</head>
<body>
  <main class="wrap">
    <div class="logo">✦</div>
    <div class="kicker">ONEMONTH OS</div>
    <h1>กำลังเปิดเวอร์ชันล่าสุด</h1>
    <p>ไอคอนเก่ายังเปิด URL เดิมได้ แต่หน้านี้จะส่งต่อไปยังระบบล่าสุดอัตโนมัติ</p>
    <div class="bar"><i></i></div>
    <div class="version">FORWARD → V34.1</div>
  </main>

<script>
(() => {
  const target = './index.html?v=341&fresh=' + Date.now();
  setTimeout(() => {
    location.replace(target);
  }, 250);
})();
</script>
</body>
</html>
