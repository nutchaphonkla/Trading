<!doctype html><html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02060a"><title>OneMonth OS Recovery</title>
<style>html,body{margin:0;height:100%;background:#02060a;color:#eef3f6;font-family:-apple-system,sans-serif}body{display:grid;place-items:center}.x{text-align:center;padding:24px}.logo{width:90px;height:90px;border-radius:25px;overflow:hidden;margin:0 auto 18px}.logo img{width:100%;height:100%;object-fit:cover}p{color:#71808d;font-size:12px;line-height:1.7}</style></head>
<body><div class="x"><div class="logo"><img src="./icon-512.png?v=257"></div><h2>OneMonth OS Recovery</h2><p id="s">กำลังเอา Service Worker / Cache เก่าออก…<br><b>Plan / Session / AI Memory ไม่ถูกลบ</b></p></div>
<script>(async()=>{try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister().catch(()=>false)))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}document.getElementById('s').innerHTML='Core พร้อมแล้ว<br>กำลังเปิด V25.7…';setTimeout(()=>location.replace('./index.html?recovery='+Date.now()),300)}catch(e){location.replace('./index.html?recovery='+Date.now())}})();</script></body></html>
