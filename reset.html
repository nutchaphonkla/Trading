<!doctype html>
<html lang="th"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02060a">
<title>OneMonth OS Reset</title>
<style>
html,body{margin:0;height:100%;background:#02060a;color:#eef3f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:grid;place-items:center;padding:24px;box-sizing:border-box}
.wrap{text-align:center;width:min(390px,100%)}.logo{width:92px;height:92px;border-radius:26px;overflow:hidden;margin:0 auto 20px}.logo img{width:100%;height:100%;object-fit:cover}
h2{margin:0}p{color:#71808d;font-size:11px;line-height:1.65}.bar{height:4px;background:#09131a;border-radius:99px;overflow:hidden;margin:22px auto 10px;width:min(320px,84vw)}.bar i{display:block;height:100%;width:8%;background:linear-gradient(90deg,#e4b94f,#67e8c5,#63c7f0);transition:.2s}
</style></head>
<body><div class="wrap"><div class="logo"><img src="./icon-512.png?v=260"></div><h2>OneMonth OS</h2><p id="txt">กำลังล้าง Service Worker / Cache เก่า…<br>Balance, Plan, Session และ AI Memory จะไม่ถูกลบ</p><div class="bar"><i id="bar"></i></div></div>
<script>
(async()=>{
 const b=document.getElementById('bar'),t=document.getElementById('txt');
 try{
   b.style.width='30%';
   if('serviceWorker'in navigator){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister().catch(()=>false)))}
   b.style.width='70%';
   if('caches'in window){const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}
   b.style.width='100%';t.textContent='พร้อมแล้ว · กำลังเปิด V26';
   setTimeout(()=>location.replace('./app-v260.html?fresh='+Date.now()),250);
 }catch(e){location.replace('./app-v260.html?fresh='+Date.now())}
})();
</script></body></html>
