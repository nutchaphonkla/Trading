name: Update XAUUSD data pack

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * 1-5"
    - cron: "*/10 21-23 * * 0"

permissions:
  contents: write

concurrency:
  group: onemonth-market-data-v362
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate primary failover updater
        run: node --check update-data.mjs

      - name: Update XAUUSD primary or fallback pack
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TV_FALLBACK_URL: ${{ secrets.TV_FALLBACK_URL }}
          TV_FALLBACK_TOKEN: ${{ secrets.TV_FALLBACK_TOKEN }}
        run: node update-data.mjs

      - name: Print feed mode
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const h = JSON.parse(fs.readFileSync('feed-health.json', 'utf8'));
          console.log('ACTIVE FEED:', h.active);
          console.log('MODE:', h.mode);
          console.log('STATUS:', h.status);
          console.log('REASON:', h.reason);
          console.log('PRIMARY:', h.primary?.status, h.primary?.error || 'OK');
          console.log('MT5 FALLBACK:', h.fallback?.checked ? h.fallback?.status : 'STANDBY / NOT QUERIED');
          console.log('RECOVERY:', `${h.switching?.primaryRecoveryStreak || 0}/${h.switching?.primaryRecoveryRequired || 2}`);
          console.log('MERGE FEEDS:', h.switching?.mergeFeeds);
          NODE

      - name: Commit market data and feed health
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add xauusd.json news.json feed-health.json

          if git diff --cached --quiet; then
            echo "No market-data changes"
            exit 0
          fi

          git commit -m "data: update V36.2 primary failover XAUUSD pack"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
