name: Update XAUUSD data pack

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * 1-5"
    - cron: "*/10 21-23 * * 0"

permissions:
  contents: write

concurrency:
  group: onemonth-market-data-v38
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate V38 data and shadow engines
        run: |
          node --check update-data.mjs
          node --check build-ai-shadow.mjs

      - name: Update PRIMARY or isolated MT5 fallback
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TV_FALLBACK_URL: ${{ secrets.TV_FALLBACK_URL }}
          TV_FALLBACK_TOKEN: ${{ secrets.TV_FALLBACK_TOKEN }}
        run: node update-data.mjs

      - name: Shadow self-play forward test
        run: node build-ai-shadow.mjs

      - name: Verify strict feed isolation
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('feed-health.json','utf8'));
          console.log('ACTIVE FEED:',h.active);
          console.log('MODE:',h.mode);
          console.log('STATUS:',h.status);
          console.log('REASON:',h.reason);
          console.log('PRIMARY:',h.primary?.status,h.primary?.error||'OK');
          console.log('MT5:',h.fallback?.checked?h.fallback?.status:'STANDBY / NOT QUERIED');
          console.log('RECOVERY:',`${h.switching?.primaryRecoveryStreak||0}/${h.switching?.primaryRecoveryRequired||2}`);
          console.log('MERGE FEEDS:',h.switching?.mergeFeeds);
          if(h.switching?.mergeFeeds===true) throw new Error('V38 policy violation: feed merge is forbidden');
          if(fs.existsSync('ai-shadow-journal.json')){
            const s=JSON.parse(fs.readFileSync('ai-shadow-journal.json','utf8'));
            console.log('SHADOW SELF-PLAY:',s.summary||{});
          }
          NODE

      - name: Commit V38 market and self-play packs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for f in \
            xauusd.json \
            xauusd-primary.json \
            xauusd-fallback.json \
            news.json \
            feed-health.json \
            ai-shadow-journal.json
          do
            if [ -e "$f" ]; then
              git add "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "No market/self-play changes"
            exit 0
          fi

          git commit -m "data: V38 market + shadow self-play"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
